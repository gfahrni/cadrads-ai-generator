name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verifier la version
        run: python --version

      - name: Installer les dependances (aucune)
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Le plan se construit sans appel reseau
        run: python run.py --plan-only --limit 5

      - name: La plomberie tourne en dry-run
        run: python run.py --dry-run --limit 3
